# This is an example and generic rbac role definition for orion. It could be
# fine tuned and split per component.
# The required permission per component should be:
# keeper/proxy/sentinel: update their own pod annotations
# sentinel/api: get, create, update configmaps (the cluster data)
# sentinel: get, create, update leases (the sentinel leader election)
# api: get leases (the current sentinel leader)
# sentinel/api: list components pods
# sentinel/api: get components pods annotations

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orion
  namespace: default
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - configmaps
  - events
  verbs:
  - "*"
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
