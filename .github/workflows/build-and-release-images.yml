name: Build images and add to ghcr.io upon release
on:
  release:
    types:
      - published

jobs:
  e2e-other-images:
    name: Build and push rest of the images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - proxy
          - sentinel
          - cli
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.0.0

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=ghcr.io/${{ github.repository_owner }}/${{ github.repository }}/${{ matrix.image }},enable=true
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest
            type=sha

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.${{ matrix.image }}
          push: true
          platforms: 'linux/amd64,linux/arm64'
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  keeper:
    name: Push keeper images to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    strategy:
      matrix:
        pgversion: ['13', '14', '15', '16', '17']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=ghcr.io/${{ github.repository_owner }}/${{ github.repository }}/keeper,enable=true
          tags: |
            type=raw,value=${{ matrix.pgversion }}-latest
            type=raw,value=${{ matrix.pgversion }}-${github.ref_name}
            type=sha

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.keeper
          push: true
          platforms: 'linux/amd64,linux/arm64'
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
        env:
          PGVERSION: ${{matrix.pgversion}}
