name: CI run on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # In the merge queue, on main (and when started by hand) everything runs, with e2e tests on all
  # PostgreSQL versions
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

# A new push to a PR cancels the run of the previous push
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codechanges:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.decide.outputs.go }}
      e2e: ${{ steps.decide.outputs.e2e }}
      shell: ${{ steps.decide.outputs.shell }}
      docs: ${{ steps.decide.outputs.docs }}
      pgversions: ${{ steps.decide.outputs.pgversions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: filter
        if: github.event_name == 'pull_request'
        with:
          files_yaml: |
            ci:
              - '.github/workflows/ci-run-on-pr.yaml'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yaml'
              - '.testcoverage.yaml'
              - 'Makefile'
            e2e_src:
              - '**/*.go'
              - '!**/*_test.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile.*'
              - 'Makefile'
            e2e_tests:
              - 'tests/**'
            shell:
              - '**/*.sh'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'mkdocs_overrides/**'
              - 'docs-requirements.txt'
              - '.github/workflows/build-and-publish-docs.yaml'
            all_pg:
              - 'Dockerfile.keeper'
              - 'cmd/keeper/**'
              - 'internal/postgresql/**'
      - name: Decide which jobs to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          CI_CHANGED: ${{ steps.filter.outputs.ci_any_changed }}
          GO_CHANGED: ${{ steps.filter.outputs.go_any_changed }}
          DOCS_CHANGED: ${{ steps.filter.outputs.docs_any_changed }}
          E2E_SRC_CHANGED: ${{ steps.filter.outputs.e2e_src_any_changed }}
          E2E_TESTS_CHANGED: ${{ steps.filter.outputs.e2e_tests_any_changed }}
          SHELL_CHANGED: ${{ steps.filter.outputs.shell_any_changed }}
          ALL_PG_CHANGED: ${{ steps.filter.outputs.all_pg_any_changed }}
        run: |
          if [ "${EVENT}" != pull_request ] || [ "${CI_CHANGED}" = true ]; then
            # Run everything in the merge queue, on main, when started by hand, and when this workflow changes
            go=true e2e=true shell=true all_pg=true
            # The merge queue tests the oldest and the newest PostgreSQL version, like PRs: a PR that changes keeper
            # or PostgreSQL code already tested all versions, and main tests all versions after the merge
            if [ "${EVENT}" = merge_group ]; then
              all_pg=false
            fi
          else
            go=${GO_CHANGED:-false}
            shell=${SHELL_CHANGED:-false}
            all_pg=${ALL_PG_CHANGED:-false}
            e2e=false
            if [ "${E2E_SRC_CHANGED}" = true ] || [ "${E2E_TESTS_CHANGED}" = true ]; then
              e2e=true
            fi
          fi
          # Drafts get the quick checks only; the images and e2e tests run once the PR is ready for review
          if [ "${DRAFT}" = true ]; then
            e2e=false
          fi
          # PRs and the merge queue test the oldest and the newest PostgreSQL version, unless keeper or PostgreSQL code
          # changed (PRs), or on main
          if [ "${all_pg}" = true ]; then
            pgversions='["14","15","16","17","18"]'
          else
            pgversions='["14","18"]'
          fi
          docs=${DOCS_CHANGED:-false}
          if [ "${EVENT}" != pull_request ] || [ "${CI_CHANGED}" = true ]; then
            docs=true
          fi
          {
            echo "go=${go}"
            echo "e2e=${e2e}"
            echo "shell=${shell}"
            echo "docs=${docs}"
            echo "pgversions=${pgversions}"
          } | tee -a "${GITHUB_OUTPUT}"

  check-go:
    name: Ensure Go modules synchronicity
    runs-on: ubuntu-24.04
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.go == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download all Go modules
        run: |
          go mod download
      - name: Check for tidiness of go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code -- .

  lint-go:
    name: Lint Go code
    runs-on: ubuntu-24.04
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.go == 'true' }}
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # for golangci/golangci-lint-action to fetch pull requests
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Built with go install (from the Go module proxy) instead of downloaded from GitHub releases
          version: v2.15.0
          install-mode: goinstall
          args: --verbose --timeout=10m

  shellcheck:
    name: Shellcheck
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.shell == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck is preinstalled on the ubuntu runners, so this doesn't depend on a download from GitHub releases
      - name: Run ShellCheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' '*.bash' | xargs -0 --no-run-if-empty shellcheck

  check-docs:
    name: Build the docs
    runs-on: ubuntu-24.04
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.docs == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs-requirements.txt
      # Only needed for the social plugin (not enabled yet)
      # - name: Install system libraries for the social cards
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y --no-install-recommends libcairo2
      - name: Install Python dependencies
        run: pip install -r docs-requirements.txt
      - name: Build the docs, failing on warnings (like broken links)
        run: mkdocs build --strict

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-24.04
    needs:
      - codechanges
    permissions:
      contents: write # to push the coverage badge to the badges branch (on main)
      pull-requests: write
    if: ${{ needs.codechanges.outputs.go == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: check test coverage
        id: coverage
        uses: vladopajic/go-test-coverage@6890500b00a7e5862e54662c04ea9fa7c799ce1e # v2.23.0
        continue-on-error: true # Should fail after coverage comment is posted
        with:
          config: .testcoverage.yaml
          profile: cover.out
      - name: Generate test results artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unittests-coverage
          path: cover.out
      - name: create badge
        # the badge is pushed to the badges branch, on main only
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: vladopajic/go-test-coverage@6890500b00a7e5862e54662c04ea9fa7c799ce1e # v2.23.0
        continue-on-error: true # 'finally check coverage' fails the job when the coverage is too low
        with:
          config: .testcoverage.yaml
          profile: cover.out
          git-token: ${{ secrets.GITHUB_TOKEN }}
          git-branch: badges
      - name: post coverage report
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        # PRs from forks get a read-only token, so they can't comment
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: coverage-report
          pr-number: ${{ github.event.pull_request.number }}
          message: |
            go-test-coverage report:
            ```
            ${{ fromJSON(steps.coverage.outputs.report) }}```
      - name: 'finally check coverage'
        if: steps.coverage.outcome == 'failure'
        shell: bash
        run: echo "coverage check failed" && exit 1

  e2e-keeper-images:
    name: Build keeper images for running e2e
    runs-on: ubuntu-24.04
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.e2e == 'true' }}
    strategy:
      matrix:
        pgversion: ${{ fromJSON(needs.codechanges.outputs.pgversions) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build keeper images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          build-args: PGVERSION=${{ matrix.pgversion }}
          context: .
          file: ./Dockerfile.keeper
          push: false
          cache-from: type=gha,scope=keeper-${{ matrix.pgversion }}
          cache-to: type=gha,mode=max,scope=keeper-${{ matrix.pgversion }}
          platforms: linux/amd64
          # the e2e tests use keeper-<pgversion>:latest
          tags: keeper-${{ matrix.pgversion }}:latest

      - name: Save image to tar
        run: docker save keeper-${{ matrix.pgversion }} > keeper-${{ matrix.pgversion }}.tar
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keeper-image-${{ matrix.pgversion }}
          path: keeper-${{ matrix.pgversion }}.tar

  e2e-other-images:
    name: Build other images for running e2e
    runs-on: ubuntu-24.04
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.e2e == 'true' }}
    strategy:
      matrix:
        image:
          - api
          - proxy
          - sentinel
          - cli
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          context: .
          file: ./Dockerfile.${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64
          # the e2e tests use <image>:latest
          tags: ${{ matrix.image }}:latest

      - name: Save image to tar
        run: docker save ${{ matrix.image }} > ${{ matrix.image }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.image }}-image
          path: ${{ matrix.image }}.tar

  e2e-test:
    name: Run e2e tests
    runs-on: ubuntu-24.04
    needs:
      - codechanges
      - e2e-keeper-images
      - e2e-other-images
    if: ${{ needs.codechanges.outputs.e2e == 'true' }}
    strategy:
      matrix:
        pgversion: ${{ fromJSON(needs.codechanges.outputs.pgversions) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download keeper artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: images
          merge-multiple: true
          pattern: keeper-image-${{ matrix.pgversion }}

      - name: Download other artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: images
          merge-multiple: true
          pattern: '*-image'

      - name: Load image
        run: |
          for f in images/*.tar; do
            if [ -f "$f" ]; then
              echo "Loading $f..."
              docker load < "$f"
            fi
          done

      - name: Test
        run: make e2e-test
        env:
          PGVERSION: ${{ matrix.pgversion }}

  # The required check for the e2e tests. It must always run: when e2e tests are not needed it passes, and when they
  # are, it only passes when the images were built and the e2e tests passed on every PostgreSQL version (a failed image
  # build makes e2e-test skipped, which must not count as a pass).
  check-e2e-status:
    runs-on: ubuntu-24.04
    needs:
      - codechanges
      - e2e-keeper-images
      - e2e-other-images
      - e2e-test
    if: always()
    steps:
      - name: Evaluate e2e status
        env:
          E2E_NEEDED: ${{ needs.codechanges.outputs.e2e }}
          CODECHANGES: ${{ needs.codechanges.result }}
          KEEPER_IMAGES: ${{ needs.e2e-keeper-images.result }}
          OTHER_IMAGES: ${{ needs.e2e-other-images.result }}
          E2E_TEST: ${{ needs.e2e-test.result }}
        run: |
          echo "codechanges: ${CODECHANGES}, e2e needed: ${E2E_NEEDED:-unknown}"
          echo "keeper images: ${KEEPER_IMAGES}, other images: ${OTHER_IMAGES}, e2e tests: ${E2E_TEST}"
          if [ "${CODECHANGES}" != success ]; then
            echo "::error::Could not determine whether the e2e tests are needed"
            exit 1
          fi
          if [ "${E2E_NEEDED}" != true ]; then
            echo "No e2e tests needed for these changes"
            exit 0
          fi
          for result in "${KEEPER_IMAGES}" "${OTHER_IMAGES}" "${E2E_TEST}"; do
            if [ "${result}" != success ]; then
              echo "::error::The image builds and e2e tests must all succeed"
              exit 1
            fi
          done
          echo "Images built and e2e tests passed"

  license-header-test:
    name: License header test
    runs-on: ubuntu-24.04
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.go == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: |
          function go_files_without_license_info() {
          	find . -type f -iname '*.go' ! -path './vendor/*' ! -path './tests/*' ! -name '*_test.go' | while read -r file; do
          		head -n3 "${file}" | grep -Eq "(Copyright|generated|GENERATED)" || echo -e "  ${file}"
          	done
          }
          
          echo "Checking for license header..."
          IFS=$'\n' read -r -d '' -a licRes < <(go_files_without_license_info) || true
          if ((${#licRes[@]})); then
          	echo -e "license header checking failed:\n${licRes[*]}"
          	exit 255
          fi

          echo Success
