# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # one PR per week for all updates of this ecosystem, instead of one per dependency
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # one PR per week for all updates of this ecosystem, instead of one per dependency
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # one PR per week for all updates of this ecosystem, instead of one per dependency
    groups:
      docker-images:
        patterns: ["*"]
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
